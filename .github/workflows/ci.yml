name: Codespaces Evaluation CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Java Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build
        run: mvn clean package -DskipTests

      - name: Test
        run: mvn test

  helm-validate:
    name: Helm Lint & Template
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint helm/demo-service

      - name: Helm template (default values)
        run: helm template demo-service helm/demo-service

      - name: Helm template (ingress enabled)
        run: |
          helm template demo-service helm/demo-service \
            --set ingress.enabled=true \
            --set ingress.host=demo.example.com

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t demo-service:${{ github.sha }} .

      - name: Smoke test container
        run: |
          docker run -d --name demo -p 8080:8080 demo-service:${{ github.sha }}
          sleep 10
          curl --retry 5 --retry-delay 2 --retry-connrefused http://localhost:8080/health
          docker stop demo

  aks-dry-run:
    name: AKS Helm Dry-Run
    runs-on: ubuntu-latest
    needs: [build-and-test, helm-validate]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Helm dry-run (simulates AKS install)
        run: |
          helm install demo-service helm/demo-service \
            --dry-run \
            --set image.tag=${{ github.sha }} \
            --debug
